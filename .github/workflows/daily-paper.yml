name: Daily paper

on:
  schedule:
    # 23:30 UTC = 08:30 KST (다음 날). GitHub Actions 스케줄은 부하에 따라
    # 수 분~수십 분 지연될 수 있다.
    - cron: "30 23 * * *"

  workflow_dispatch:
    inputs:
      topic:
        description: "주제 고정 (geoai, geoxai, env-planning, urban-planning, carbon-neutral, carbon-reduction, gis, remote-sensing)"
        required: false
        type: string
      date:
        description: "게시 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
        type: string
      dry_run:
        description: "후보 선정까지만 실행 (Claude API 호출 없음)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-paper
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: 논문 선정 및 요약
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${{ inputs.topic }}" ]; then args+=(--topic "${{ inputs.topic }}"); fi
          if [ -n "${{ inputs.date }}" ]; then args+=(--date "${{ inputs.date }}"); fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          python scripts/daily_paper.py "${args[@]}"

      - name: 변경 사항 커밋
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain _posts data)" ]; then
            echo "새 포스트가 없다. 커밋을 건너뛴다."
            exit 0
          fi
          git config user.name  "daily-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts data
          title=$(git diff --cached --name-only -- _posts | head -1 | xargs -r basename | sed 's/\.md$//')
          git commit -m "post: ${title:-daily paper $(date -u +%F)}"
          git push
