# 선택적 폴백 경로 — 평소에는 쓰지 않는다.
#
# 기본 운영은 Claude 루틴(스케줄 클라우드 에이전트)이 담당하며, Max 구독 한도로
# 동작하므로 API 과금이 없다. 이 워크플로는 루틴이 막혔을 때를 대비한 수동 백업이며,
# 실행하려면 저장소 Secret에 ANTHROPIC_API_KEY가 있어야 하고 사용량만큼 과금된다.
#
# 스케줄 트리거는 일부러 두지 않았다. 루틴과 동시에 돌면 같은 날 두 편이 올라간다.

name: Daily paper (수동 폴백)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "주제 고정 (geoai, geoxai, env-planning, urban-planning, carbon-neutral, carbon-reduction, gis, remote-sensing)"
        required: false
        type: string
      date:
        description: "게시 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
        type: string
      no_fulltext:
        description: "PDF 전문 추출을 건너뛰고 초록만 사용 (비용 절감)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-paper
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-api.txt

      - name: 의존성 설치
        run: pip install -r scripts/requirements-api.txt

      - name: 논문 선정 및 요약
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          args=(run)
          if [ -n "${{ inputs.topic }}" ]; then args+=(--topic "${{ inputs.topic }}"); fi
          if [ -n "${{ inputs.date }}" ]; then args+=(--date "${{ inputs.date }}"); fi
          if [ "${{ inputs.no_fulltext }}" = "true" ]; then args+=(--no-fulltext); fi
          python scripts/daily_paper.py "${args[@]}"

      - name: 변경 사항 커밋
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain _posts data/state.json)" ]; then
            echo "새 포스트가 없다. 커밋을 건너뛴다."
            exit 0
          fi
          git config user.name  "daily-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts data/state.json
          title=$(git diff --cached --name-only -- _posts | head -1 | xargs -r basename | sed 's/\.md$//')
          git commit -m "post: ${title:-daily paper $(date -u +%F)}"
          git push
